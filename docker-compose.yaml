version: '3.9'

services:

  postgres:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: ProjectManagment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

  identity-service:
    build:
      context: ./identity-service
    container_name: identity-service
    restart: always
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ProjectManagment
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

        # ✉️ Почта (обязательно для автоконфигурации JavaMailSender)
      SPRING_MAIL_HOST: smtp.yandex.ru
      SPRING_MAIL_PORT: 465
      SPRING_MAIL_USERNAME: safedack@yandex.ru
      SPRING_MAIL_PASSWORD: wax150wax
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: "true"
      SPRING_MAIL_PROTOCOL: smtps

        # 🔧 Кастомные @Value из EmailService.java
      APP_EMAIL_FROM: safedack@yandex.ru
      APP_FRONTEND_URL: http://localhost:3000

volumes:
  postgres_data: