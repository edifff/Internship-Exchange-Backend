<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Еженедельный отчёт</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
<h2>📊 Еженедельный отчёт по откликам</h2>
<p>Здравствуйте, <b th:text="${employerName}"></b>!</p>
<p>Отчёт сформирован за период: <b th:text="${reportDate}"></b></p>

<h3>Статистика по вакансиям:</h3>
<table style="border-collapse: collapse; width: 100%; margin-bottom: 20px;">
    <tr style="background-color: #f4f4f4;">
        <th style="border: 1px solid #ddd; padding: 8px;">Вакансия</th>
        <th style="border: 1px solid #ddd; padding: 8px;">Новые отклики</th>
    </tr>
    <tr th:each="entry : ${vacancyStats}">
        <td style="border: 1px solid #ddd; padding: 8px;" th:text="${entry.key}"></td>
        <td style="border: 1px solid #ddd; padding: 8px; text-align: center;" th:text="${entry.value}"></td>
    </tr>
</table>

<p>Посмотреть все отклики и управлять вакансиями: <a th:href="${frontendUrl}">Личный кабинет работодателя</a></p>
<hr>
<small style="color: #777;">Это автоматическая рассылка биржи стажировок.</small>
</body>
</html>
